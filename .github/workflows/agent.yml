name: Claude Code Agent

on:
  issues:
    types: [assigned, opened, edited]
  issue_comment:
    types: [created]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.eval.outputs.run }}
    permissions:
      issues: read
    steps:
      - name: Decide if default agent should run
        id: eval
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number;
            if (!issueNumber) {
              core.setOutput('run', 'false');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const hasVercelLabel = issue.labels.some(
              (l) => l.name === 'vercel-hosting'
            );
            if (hasVercelLabel) {
              core.setOutput('run', 'false');
              return;
            }
            const commentBody = context.payload.comment?.body ?? '';
            const issueBody = issue.body ?? '';
            const issueTitle = issue.title ?? '';
            const hasMention =
              commentBody.toLowerCase().includes('@claude') ||
              issueBody.toLowerCase().includes('@claude') ||
              issueTitle.toLowerCase().includes('@claude');
            const assigned =
              context.eventName === 'issues' &&
              context.payload.action === 'assigned' &&
              context.payload.assignee?.login === 'github-actions[bot]';
            core.setOutput('run', hasMention || assigned ? 'true' : 'false');

  claude-agent:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          assignee_trigger: "github-actions[bot]"
          trigger_phrase: "@claude"
          prompt: |
            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Triggering comment (if any):
            ${{ github.event.comment.body }}

            Read and follow:
            - CLAUDE.md
            - .github/agent-tasks/implement-feature.md

            Implement the work requested in the issue/comment. Use TDD for API changes.
            Open a PR targeting main with a clear description and test plan. Do not merge.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 20
            --system-prompt "Follow CLAUDE.md and implement-feature.md. Do not modify .github/workflows/ci.yml. Concurrency gate and commits: CLAUDE.md only."
