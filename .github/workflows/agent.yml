name: Claude Code Agent

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]

jobs:
  claude-agent:
    if: >
      !contains(join(github.event.issue.labels.*.name, ','), 'vercel-hosting') &&
      (
        (github.event_name == 'issues' &&
         github.event.assignee.login == 'github-actions[bot]') ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude'))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          assignee_trigger: "github-actions[bot]"
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 30
            --system-prompt "Before making changes, read CLAUDE.md at the repository root and .github/agent-tasks/implement-feature.md. Follow both exactly. Implement only what the GitHub issue describes. Use TDD for API changes. Open a PR targeting main with a clear description; do not merge. Do not modify api/src/__tests__/concurrency.test.ts except additions allowed by CLAUDE.md. Do not modify .github/workflows/ci.yml."
