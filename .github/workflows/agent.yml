name: Issue Agents (Claude / Cursor)

on:
  issues:
    types: [assigned, opened, edited]
  issue_comment:
    types: [created]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.eval.outputs.run }}
      provider: ${{ steps.eval.outputs.provider }}
      model: ${{ steps.eval.outputs.model }}
      max_turns: ${{ steps.eval.outputs.max_turns }}
      max_budget_usd: ${{ steps.eval.outputs.max_budget_usd }}
      task_file: ${{ steps.eval.outputs.task_file }}
      system_prompt: ${{ steps.eval.outputs.system_prompt }}
    permissions:
      issues: write
    steps:
      - name: Decide agent lane and provider
        id: eval
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number;
            if (!issueNumber) {
              core.setOutput('run', 'false');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labelNames = issue.labels.map((l) =>
              typeof l === 'string' ? l : l.name
            );
            const hasApi = labelNames.includes('api');
            const hasWeb = labelNames.includes('web');
            const hasInfra = labelNames.includes('infra');

            const commentBody = context.payload.comment?.body ?? '';
            const issueBody = issue.body ?? '';
            const issueTitle = issue.title ?? '';

            const pickProvider = (text) => {
              const lower = text.toLowerCase();
              const hasClaude = lower.includes('@claude');
              const hasCursor = lower.includes('@cursor');
              if (hasClaude && hasCursor) return 'conflict';
              if (hasClaude) return 'claude';
              if (hasCursor) return 'cursor';
              return null;
            };

            const textHasAgentTrigger = (text) => {
              const lower = text.toLowerCase();
              return lower.includes('@claude') || lower.includes('@cursor');
            };

            const botAssigned =
              context.eventName === 'issues' &&
              context.payload.action === 'assigned' &&
              context.payload.assignee?.login === 'github-actions[bot]';

            let provider = null;
            if (context.payload.comment?.body) {
              provider = pickProvider(commentBody);
            } else {
              provider = pickProvider(`${issueTitle}\n${issueBody}`);
            }

            const triggered =
              textHasAgentTrigger(commentBody) ||
              textHasAgentTrigger(issueBody) ||
              textHasAgentTrigger(issueTitle) ||
              botAssigned;

            const comment = async (body) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            };

            if (!triggered) {
              core.setOutput('run', 'false');
              return;
            }

            if (provider === 'conflict') {
              core.setOutput('run', 'false');
              await comment(
                'Use **one** agent per trigger: `@claude` or `@cursor` (not both in the same comment or issue text).'
              );
              return;
            }

            if (botAssigned && !provider) {
              provider = 'claude';
            }

            if (!provider) {
              core.setOutput('run', 'false');
              await comment(
                'Specify which agent to run: comment `@claude` or `@cursor` (with label `api` or `web`). Assigning the bot alone runs **Claude**.'
              );
              return;
            }

            core.setOutput('provider', provider);

            if (hasInfra) {
              core.setOutput('run', 'false');
              await comment(
                `Issues labeled \`infra\` are handled by humans only — neither Claude nor Cursor agents run on this lane.`
              );
              return;
            }

            if (hasApi && hasWeb) {
              core.setOutput('run', 'false');
              await comment(
                'Agent needs exactly one lane label: `api` or `web` (not both). Remove one label and trigger again with `@claude` or `@cursor`, or assign the bot.'
              );
              return;
            }

            if (hasApi) {
              core.setOutput('run', 'true');
              core.setOutput('model', 'claude-sonnet-4-6');
              core.setOutput('max_turns', '20');
              core.setOutput('max_budget_usd', '3');
              core.setOutput('task_file', 'implement-feature.md');
              core.setOutput(
                'system_prompt',
                'Follow CLAUDE.md and implement-feature.md. Do not modify .github/workflows/ci.yml. Concurrency gate and commits: CLAUDE.md only.'
              );
              return;
            }

            if (hasWeb) {
              core.setOutput('run', 'true');
              core.setOutput('model', 'claude-sonnet-4-6');
              core.setOutput('max_turns', '65');
              core.setOutput('max_budget_usd', '4');
              core.setOutput('task_file', 'implement-feature-web.md');
              core.setOutput(
                'system_prompt',
                'Follow CLAUDE.md and implement-feature-web.md. Do not modify .github/workflows/ci.yml or api/src/__tests__/concurrency.test.ts. Concurrency gate and commits: CLAUDE.md only.'
              );
              return;
            }

            core.setOutput('run', 'false');
            await comment(
              'To run an agent, add label `api` or `web` (one only). Label `infra` is human-only. Then comment `@claude` or `@cursor`.'
            );

  claude-agent:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.provider == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          assignee_trigger: "github-actions[bot]"
          trigger_phrase: "@claude"
          display_report: true
          settings: |
            {"enableAllProjectMcpServers": false}
          prompt: |
            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Triggering comment (if any):
            ${{ github.event.comment.body }}

            Read and follow:
            - CLAUDE.md
            - .github/agent-tasks/${{ needs.gate.outputs.task_file }}

            Implement **only** the issue titled above. Do **not** implement other issue numbers,
            "optional" sections, or parent epic scope unless this issue's **Scope** section requires it.
            If the issue lists **Files**, read only those paths plus direct imports; no repo-wide search
            unless blocked. On turn limit or incomplete work: push the branch if any commits exist,
            open or update the PR, and comment what remains.

            Open a PR targeting main with a clear description and test plan. Do not merge.

            Efficiency: touch only files named in the issue. Run `cd web && npm run typecheck && npm run lint`
            once before commit (when web/ changed). Skip `npm run build` unless the issue requires it.
          claude_args: |
            --model ${{ needs.gate.outputs.model }}
            --max-turns ${{ needs.gate.outputs.max_turns }}
            --max-budget-usd ${{ needs.gate.outputs.max_budget_usd }}
            --system-prompt "${{ needs.gate.outputs.system_prompt }}"
            --append-system-prompt "Efficiency: edit only files listed in the issue; do not enable or invoke MCP tools; run cd web && npm run typecheck && npm run lint once before commit when web/ changed; run npm run build only if issue acceptance requires it; one commit then open PR; do not re-run verification after a clean pass. If interrupted by turn limit, push branch and comment remaining checklist items."
            --permission-mode bypassPermissions
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep"
            --allowedTools "Bash(npm run *),Bash(cd *),Bash(npx *),Bash(git *)"

  cursor-agent:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.provider == 'cursor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cursor-issue-agent-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Start Cursor Cloud Agent
        uses: actions/github-script@v7
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_TASK_FILE: ${{ needs.gate.outputs.task_file }}
          AGENT_SYSTEM_PROMPT: ${{ needs.gate.outputs.system_prompt }}
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const enqueuedLabel = 'cursor-agent-enqueued';

            const comment = async (body) => {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            };

            if (!process.env.CURSOR_API_KEY) {
              await comment(
                'Cursor agent was requested (`@cursor`) but `CURSOR_API_KEY` is not configured on this repository. Add the secret from the Cursor dashboard (Cloud → Integrations).'
              );
              core.setFailed('CURSOR_API_KEY missing');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const labelNames = issue.labels.map((l) =>
              typeof l === 'string' ? l : l.name
            );
            if (labelNames.includes(enqueuedLabel)) {
              await comment(
                `A Cursor cloud agent was already enqueued for this issue (label \`${enqueuedLabel}\`). Open the previous agent run in Cursor or remove the label to trigger again.`
              );
              return;
            }

            const taskFile = process.env.AGENT_TASK_FILE ?? 'implement-feature.md';
            const systemPrompt =
              process.env.AGENT_SYSTEM_PROMPT ??
              'Follow CLAUDE.md. Do not modify .github/workflows/ci.yml.';
            const issueTitle = issue.title ?? '';
            const issueBody = issue.body ?? '(no body)';
            const issueUrl = issue.html_url;
            const branchName = `agent/issue-${issueNumber}`;
            const repositoryUrl = `https://github.com/${owner}/${repo}`;

            const promptText = [
              `# GitHub Issue #${issueNumber}`,
              '',
              '## Repository task',
              '',
              `Repository: ${repositoryUrl}`,
              `Issue URL: ${issueUrl}`,
              '',
              systemPrompt,
              '',
              'Read and follow in the repo:',
              '- CLAUDE.md',
              `- .github/agent-tasks/${taskFile}`,
              '',
              '## Title',
              '',
              issueTitle,
              '',
              '## Issue body',
              '',
              issueBody,
              '',
              '---',
              '',
              '## Required pull request',
              '',
              `Open a PR targeting \`main\` with a clear description and test plan. Do not merge.`,
              `Put this line verbatim in the PR description: Closes #${issueNumber}`,
              '',
              'Implement **only** this issue. If the issue lists **Files**, edit only those paths plus direct imports.',
              'Do not modify `.github/workflows/ci.yml` or weaken `api/src/__tests__/concurrency.test.ts`.',
            ].join('\n');

            const requestBody = {
              prompt: { text: promptText },
              source: { repository: repositoryUrl, ref: 'main' },
              target: { autoCreatePr: true, branchName },
            };

            const auth = Buffer.from(
              `${process.env.CURSOR_API_KEY}:`,
              'utf8'
            ).toString('base64');

            const response = await fetch('https://api.cursor.com/v0/agents', {
              method: 'POST',
              headers: {
                Authorization: `Basic ${auth}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(requestBody),
            });

            const responseText = await response.text();
            let parsed;
            try {
              parsed = JSON.parse(responseText);
            } catch {
              parsed = null;
            }

            if (!response.ok) {
              await comment(
                `Failed to start Cursor cloud agent (HTTP ${response.status}). Check that Cursor is connected to GitHub for this repo and that \`CURSOR_API_KEY\` is valid.`
              );
              core.setFailed(`Cursor API error: ${responseText}`);
              return;
            }

            const agentId = parsed?.id ?? '(unknown)';
            const agentUrl = parsed?.target?.url ?? '';
            const agentStatus = parsed?.status ?? '';

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [enqueuedLabel],
            });

            const urlLine = agentUrl
              ? `[Open agent in Cursor](${agentUrl})`
              : 'Open the Cursor dashboard → Cloud Agents for run status.';
            await comment(
              [
                '**Cursor cloud agent** started for this issue.',
                '',
                `- Agent id: \`${agentId}\``,
                agentStatus ? `- Status: \`${agentStatus}\`` : '',
                `- Branch: \`${branchName}\``,
                `- ${urlLine}`,
                '',
                'The agent will work in the cloud and can open a PR automatically. Connect GitHub in Cursor (Cloud → Agents → integrations) if the run cannot access this repository.',
              ]
                .filter(Boolean)
                .join('\n')
            );
