name: Claude Code Agent (Vercel hosting)

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]

jobs:
  claude-agent-vercel:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'vercel-hosting') &&
      (
        (github.event_name == 'issues' &&
         github.event.assignee.login == 'github-actions[bot]') ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude'))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          assignee_trigger: "github-actions[bot]"
          label_trigger: "vercel-hosting"
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 30
            --system-prompt "Before making changes, read CLAUDE.md and .github/agent-tasks/vercel-hosting.md. Follow the Vercel hosting migration section and the issue body. Implement only the phase described in the issue for this run. Use TDD. Open a PR targeting main; do not merge. Do not modify .github/workflows/ci.yml. Do not remove, skip, or weaken tests in api/src/__tests__/concurrency.test.ts unless CLAUDE.md on main explicitly allows cutover."
