name: Web feature
description: Frontend / Next.js work. Triggers Claude agent (Haiku) when labeled web and @claude or bot assigned.
title: "web: "
labels:
  - web
body:
  - type: markdown
    value: |
      Use **one** agent lane label: `api`, `web`, or `infra` (not multiple). `infra` is human-only.
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: UI, pages, components, same-origin /api usage.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional mocks, screenshots, constraints.
